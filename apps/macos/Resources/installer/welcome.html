<h1>SJTU Canvas Downloader</h1>
<p>用“交我办”扫码登录上海交通大学 Canvas，按课程批量下载课堂录像（电脑屏幕、教室摄像头）和课程文件，支持暂停与断点续传。</p>
<p>安装程序会把“SJTU Canvas Downloader”放到“应用程序”文件夹，已安装的旧版本会被替换，下载记录和设置不受影响。</p>
<p>需要 macOS 14 或更新版本。本应用与上海交通大学无关。</p>
