services:
  canvas-pocket:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?请在 .env 中设置 PUBLIC_URL}
      APP_SECRET: ${APP_SECRET:?请在 .env 中设置 APP_SECRET}
      RUST_LOG: ${RUST_LOG:-canvas_pocket_server=info,tower_http=info}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      DOWNLOAD_TICKET_TTL_MINUTES: ${DOWNLOAD_TICKET_TTL_MINUTES:-15}
      PROXY_CONCURRENCY: ${PROXY_CONCURRENCY:-8}
      VIDEO_API: ${VIDEO_API:-https://v.sjtu.edu.cn/jy-application-canvas-sjtu}
      VIDEO_LTI_ADAPTER: ${VIDEO_LTI_ADAPTER:-https://v.sjtu.edu.cn/jy-lti-adapter}
      RESOURCE_VIDEO_API: ${RESOURCE_VIDEO_API:-https://v.sjtu.edu.cn/jy-application-resourcemanage}
    volumes:
      - canvas-data:/data
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      canvas-pocket:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?请在 .env 中设置 DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  canvas-data:
  caddy-data:
  caddy-config:
