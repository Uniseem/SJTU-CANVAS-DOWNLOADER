name: Desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

# Signing is optional. Without these secrets macOS gets an unsigned installer
# package (installed from Terminal with install.sh, or allowed once in System
# Settings) and Windows an unsigned installer.
#   macOS:   MACOS_CERTIFICATE_P12 (base64 of a .p12 with the Developer ID
#            Application and Developer ID Installer certificates),
#            MACOS_CERTIFICATE_PASSWORD, MACOS_SIGN_IDENTITY, MACOS_INSTALLER_IDENTITY,
#            APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (for notarization)
#   Windows: WINDOWS_CERTIFICATE_PFX (base64), WINDOWS_CERTIFICATE_PASSWORD
#
# A pushed tag vX.Y.Z (matching engine/Cargo.toml and the Windows project)
# publishes a GitHub Release with the installers and SHA256SUMS.txt.

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            rust-target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            rust-target: x86_64-apple-darwin
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode on this runner
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i -E 'beta|_rc' | sort -V | tail -n 1 || true)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: ${{ matrix.arch }}
      - name: Engine tests
        if: matrix.arch == 'arm64'
        run: cargo test --locked --manifest-path engine/Cargo.toml
      - name: Signing keychain
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials sjtu-canvas --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
            echo "SJTU_CANVAS_NOTARY_PROFILE=sjtu-canvas" >> "$GITHUB_ENV"
          fi
          echo "SJTU_CANVAS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$MACOS_INSTALLER_IDENTITY" ]; then
            echo "SJTU_CANVAS_INSTALLER_IDENTITY=$MACOS_INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          fi
      - name: Build SJTU Canvas Downloader.app
        run: |
          # Unsigned builds ship only the installer package: an app installed
          # by macOS Installer is not quarantined, so it opens directly.
          if [ -n "${SJTU_CANVAS_SIGN_IDENTITY:-}" ]; then
            bash apps/macos/build.sh --arch ${{ matrix.arch }} --pkg --dmg --zip
          else
            bash apps/macos/build.sh --arch ${{ matrix.arch }} --pkg
          fi
      - name: Install the package and start the app
        run: |
          sudo installer -pkg "apps/macos/dist/SJTUCanvasDownloader-macos-${{ matrix.arch }}.pkg" -target /
          app="/Applications/SJTU Canvas Downloader.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/sjtu-canvas-engine" --version
          open "$app"
          # The app starts its engine; both must be running.
          for _ in $(seq 1 60); do
            if pgrep -x sjtu-canvas-engine >/dev/null; then break; fi
            sleep 1
          done
          pgrep -x SJTUCanvasDownloader
          pgrep -x sjtu-canvas-engine
          osascript -e 'quit app "SJTU Canvas Downloader"' || true
      - uses: actions/upload-artifact@v4
        with:
          name: SJTUCanvasDownloader-macos-${{ matrix.arch }}
          path: |
            apps/macos/dist/SJTUCanvasDownloader-macos-${{ matrix.arch }}.pkg
            apps/macos/dist/SJTUCanvasDownloader-macos-${{ matrix.arch }}.dmg
            apps/macos/dist/SJTUCanvasDownloader-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      SJTU_CANVAS_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Inno Setup 7.1.0
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.1.0-x64.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne "0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F") { throw "Inno Setup checksum mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP "innosetup"
          Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/PORTABLE=1", "/DIR=$dir" -Wait
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "ISCC.exe missing" }
          "SJTU_CANVAS_ISCC=$dir\ISCC.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Engine tests
        run: cargo test --locked --manifest-path engine/Cargo.toml
      - name: Signing certificate
        if: env.WINDOWS_CERTIFICATE_PFX != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sjtu-canvas.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          "SJTU_CANVAS_SIGN_PFX=$pfx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build SJTU Canvas Downloader
        shell: pwsh
        run: ./apps/windows/build.ps1 -Installer
      - name: Install silently and uninstall
        shell: pwsh
        run: |
          $setup = "apps/windows/dist/SJTUCanvasDownloader-win-x64-setup.exe"
          $dir = Join-Path $env:RUNNER_TEMP "installed"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir" -Wait
          foreach ($file in "SJTUCanvasDownloader.exe", "engine\sjtu-canvas-engine.exe", "unins000.exe") {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "missing after install: $file" }
          }
          & (Join-Path $dir "engine\sjtu-canvas-engine.exe") --version
          Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $dir "SJTUCanvasDownloader.exe")) { throw "the uninstaller left the app behind" }
      - uses: actions/upload-artifact@v4
        with:
          name: SJTUCanvasDownloader-win-x64
          path: apps/windows/dist/SJTUCanvasDownloader-win-x64-setup.exe
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          engine="$(sed -n 's/^version = "\(.*\)"$/\1/p' engine/Cargo.toml | head -n 1)"
          windows="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' apps/windows/SJTUCanvasDownloader/SJTUCanvasDownloader.csproj | head -n 1)"
          echo "tag $tag, engine $engine, windows $windows"
          [ "$tag" = "$engine" ] && [ "$tag" = "$windows" ]
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" \
            --title "SJTU Canvas Downloader ${GITHUB_REF_NAME#v}" --notes-file ../.github/release-notes.md
