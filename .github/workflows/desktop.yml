name: Desktop apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

# Signing is optional. Without these secrets macOS gets an unsigned installer
# package (the user allows it once in System Settings; the installed app then
# opens directly) and Windows an unsigned zip.
#   macOS:   MACOS_CERTIFICATE_P12 (base64 of a .p12 with the Developer ID
#            Application and Developer ID Installer certificates),
#            MACOS_CERTIFICATE_PASSWORD, MACOS_SIGN_IDENTITY, MACOS_INSTALLER_IDENTITY,
#            APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (for notarization)
#   Windows: WINDOWS_CERTIFICATE_PFX (base64), WINDOWS_CERTIFICATE_PASSWORD

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            rust-target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            rust-target: x86_64-apple-darwin
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode on this runner
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i -E 'beta|_rc' | sort -V | tail -n 1 || true)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: ${{ matrix.arch }}
      - name: Engine tests
        if: matrix.arch == 'arm64'
        run: cargo test --locked --manifest-path engine/Cargo.toml
      - name: Signing keychain
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials sjtu-canvas --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
            echo "SJTU_CANVAS_NOTARY_PROFILE=sjtu-canvas" >> "$GITHUB_ENV"
          fi
          echo "SJTU_CANVAS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$MACOS_INSTALLER_IDENTITY" ]; then
            echo "SJTU_CANVAS_INSTALLER_IDENTITY=$MACOS_INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          fi
      - name: Build SJTU Canvas Downloader.app
        run: |
          # Unsigned builds ship only the installer package: an app installed
          # by macOS Installer is not quarantined, so it opens directly.
          if [ -n "${SJTU_CANVAS_SIGN_IDENTITY:-}" ]; then
            bash apps/macos/build.sh --arch ${{ matrix.arch }} --pkg --dmg --zip
          else
            bash apps/macos/build.sh --arch ${{ matrix.arch }} --pkg
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SJTUCanvasDownloader-macos-${{ matrix.arch }}
          path: |
            apps/macos/dist/SJTUCanvasDownloader-macos-${{ matrix.arch }}.pkg
            apps/macos/dist/SJTUCanvasDownloader-macos-${{ matrix.arch }}.dmg
            apps/macos/dist/SJTUCanvasDownloader-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      SJTU_CANVAS_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Engine tests
        run: cargo test --locked --manifest-path engine/Cargo.toml
      - name: Signing certificate
        if: env.WINDOWS_CERTIFICATE_PFX != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sjtu-canvas.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          "SJTU_CANVAS_SIGN_PFX=$pfx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build SJTU Canvas Downloader
        shell: pwsh
        run: ./apps/windows/build.ps1 -Zip
      - uses: actions/upload-artifact@v4
        with:
          name: SJTUCanvasDownloader-win-x64
          path: apps/windows/dist/SJTUCanvasDownloader-win-x64.zip
          if-no-files-found: error
